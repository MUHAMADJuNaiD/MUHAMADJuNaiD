<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Outlook Styles Hero Reel</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1440px;height:2560px;overflow:hidden;background:#000}
  #stage{position:relative;width:1440px;height:2560px;overflow:hidden}
  canvas{position:absolute;left:0;top:0;width:1440px;height:2560px}
  .ov{position:absolute;inset:0;pointer-events:none;font-family:'Montserrat',sans-serif}
  .mast{position:absolute;top:190px;left:96px;right:96px;display:flex;justify-content:space-between;align-items:center}
  .mast .brand{font-weight:700;font-size:40px;letter-spacing:.42em;margin-right:-.42em}
  .mast .side{font-weight:700;font-size:17px;letter-spacing:.3em;width:250px}
  .mast .side.r{text-align:right}
  .mast .side span{display:inline-block;padding:9px 16px;border:2px solid currentColor;border-radius:99px}
  .rule{position:absolute;top:258px;left:96px;right:96px;height:2.5px;background:currentColor;opacity:.5}
  .copy{position:absolute;left:96px;top:1770px;width:1100px}
  .kick{font-weight:700;font-size:22px;letter-spacing:.34em;display:flex;align-items:center;gap:22px}
  .kick:before{content:"";width:60px;height:3px;background:currentColor}
  .head{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:118px;line-height:1;margin:18px 0 16px;white-space:nowrap;
        text-shadow:0 8px 24px rgba(0,0,0,.18)}
  .head b{font-weight:800}
  .desc{font-size:30px;font-weight:500}
  .chip{position:absolute;left:1060px;top:1760px;width:176px;background:#FFFCF6;padding:11px 11px 0;box-shadow:0 26px 40px rgba(0,0,0,.35);transform-origin:50% 50%}
  .chip .sw{height:144px}
  .chip .t1{font-size:11px;font-weight:700;letter-spacing:.24em;color:#1a1a1a;padding:12px 0 3px}
  .chip .t2{font-size:15px;font-weight:700;letter-spacing:.1em;color:#1a1a1a;padding-bottom:13px;text-transform:uppercase}
  .wipe{position:absolute;inset:0}
  .center{position:absolute;left:0;right:0;text-align:center}
  .pill{display:inline-block;font-weight:800;font-size:34px;letter-spacing:.24em;padding:30px 60px 28px 66px;border-radius:99px;
        box-shadow:0 18px 36px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.3)}
</style>
<script type="importmap">
{"imports":{
  "three":"./node_modules/three/build/three.module.js",
  "three/addons/":"./node_modules/three/examples/jsm/",
  "https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/+esm":"./node_modules/opentype.js/dist/opentype.module.js"
}}
</script>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1440" height="2560"></canvas>
  <div class="ov" id="ov"></div>
</div>
<script type="module" src="hero.js"></script>
</body>
</html>
