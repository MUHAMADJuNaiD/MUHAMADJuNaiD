<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Outlook Styles Hero Reel v2</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1440px;height:2560px;overflow:hidden;background:#000}
  #stage{position:relative;width:1440px;height:2560px;overflow:hidden}
  canvas{position:absolute;left:0;top:0;width:1440px;height:2560px}
  .ov{position:absolute;inset:0;pointer-events:none;font-family:'Montserrat',sans-serif}
  .mq{position:absolute;left:-200px;width:1840px;white-space:nowrap;overflow:hidden;font-weight:700}
  .mq span{display:inline-block}
  .center{position:absolute;left:0;right:0;text-align:center}
  .lbl{position:absolute;left:96px;top:1560px;font-weight:700;font-size:54px;letter-spacing:.12em;line-height:1.18;
       padding:26px 40px 24px;border-radius:14px;box-shadow:0 20px 40px rgba(0,0,0,.3);transform-origin:0 50%}
  .chip{position:absolute;left:96px;top:450px;width:176px;background:#FFFCF6;padding:11px 11px 0;box-shadow:0 26px 40px rgba(0,0,0,.35)}
  .chip .sw{height:144px}
  .chip .t1{font-size:11px;font-weight:700;letter-spacing:.24em;color:#1a1a1a;padding:12px 0 3px}
  .chip .t2{font-size:15px;font-weight:700;letter-spacing:.1em;color:#1a1a1a;padding-bottom:13px;text-transform:uppercase}
  .pill{display:inline-flex;align-items:center;gap:22px;font-weight:700;font-size:36px;letter-spacing:.2em;padding:30px 60px 28px 64px;border-radius:99px;
        box-shadow:0 18px 36px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.3)}
  .head{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:104px;line-height:1;white-space:nowrap}
  .head b{font-weight:800}
</style>
<script type="importmap">
{"imports":{
  "three":"./node_modules/three/build/three.module.js",
  "three/addons/":"./node_modules/three/examples/jsm/"
}}
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="whip" x="0" y="0" width="100%" height="100%">
  <feGaussianBlur id="wb" stdDeviation="0 0" edgeMode="duplicate"/></filter></svg>
<div id="stage">
  <canvas id="c" width="1440" height="2560"></canvas>
  <div class="ov" id="ov"></div>
</div>
<script type="module" src="hero2.js"></script>
</body>
</html>
